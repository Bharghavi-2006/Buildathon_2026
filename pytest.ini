[pytest]
# A single shared event loop for the whole test session. Without this, pytest-asyncio's
# default per-test event loop causes the module-level async Postgres engine in
# app/db/session.py (created once at import time and pooled with pool_pre_ping) to hand
# out asyncpg connections created on one test's loop to a later test running on a
# different loop, which asyncpg rejects ("Future attached to a different loop"). SQLite
# tests never hit this because each test builds its own throwaway aiosqlite engine.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://sdr:sdr@postgres:5432/sdr
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: sdr-demo-password
      DEMO_MODE: "true"
    depends_on: [postgres, neo4j]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    ports: ["5432:5432"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/sdr-demo-password
    ports: ["7474:7474", "7687:7687"]
